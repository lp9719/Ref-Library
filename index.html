<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timed Practice & Media Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* ÁREA DA IMAGEM */
    .image-container {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .image-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    /* BADGE DO TEMPORIZADOR */
    .timer-badge {
      position: absolute;
      top: 28px;
      right: 28px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 1px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* CONTROLES DE TREINO */
    .practice-controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 12px;
    }

    .btn {
      background-color: #2a2a2a;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #3a3a3a;
    }

    .btn-primary {
      background-color: #007aff;
    }

    .btn-primary:hover {
      background-color: #0056b3;
    }

    /* MINI PLAYER DE MÚSICA */
    .player-card {
      background-color: #1e1e1e;
      margin: 0 16px 16px 16px;
      padding: 12px 16px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .player-title {
      font-size: 0.9rem;
      color: #aaa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 60%;
    }

    .player-btns {
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .btn-icon:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <!-- EXIBIÇÃO DA IMAGEM E TEMPORIZADOR -->
  <div class="image-container">
    <img id="display-image" src="https://picsum.photos/800/1000?random=1" alt="Imagem de referência">
    <div class="timer-badge" id="timer-display">01:00</div>
  </div>

  <!-- CONTROLES DO TIMED PRACTICE -->
  <div class="practice-controls">
    <button class="btn" id="btn-prev">⏮ Anterior</button>
    <button class="btn btn-primary" id="btn-toggle">⏸ Pausar</button>
    <button class="btn" id="btn-next">Próxima ⏭</button>
  </div>

  <!-- MINI PLAYER NATIVO (CONTROLA O ÁUDIO DO SO) -->
  <div class="player-card">
    <span class="player-title" id="music-status">🎵 Controles de Mídia do Sistema</span>
    <div class="player-btns">
      <button class="btn-icon" id="music-prev" title="Faixa Anterior">⏮</button>
      <button class="btn-icon" id="music-play" title="Play / Pause">⏯</button>
      <button class="btn-icon" id="music-next" title="Próxima Faixa">⏭</button>
    </div>
  </div>

  <script>
    // --- CONFIGURAÇÃO E ESTADO ---
    const TIME_PER_IMAGE = 60; // Tempo em segundos
    let timeLeft = TIME_PER_IMAGE;
    let isRunning = true;
    let timerInterval = null;

    // Galeria de exemplo (Substitua pelas suas URLs)
    const images = [
      'https://picsum.photos/800/1000?random=1',
      'https://picsum.photos/800/1000?random=2',
      'https://picsum.photos/800/1000?random=3'
    ];
    let currentImageIndex = 0;

    // Elementos do DOM
    const imgElement = document.getElementById('display-image');
    const timerElement = document.getElementById('timer-display');
    const btnToggle = document.getElementById('btn-toggle');
    const btnNext = document.getElementById('btn-next');
    const btnPrev = document.getElementById('btn-prev');

    // --- LÓGICA DO TEMPORIZADOR ---
    function formatTime(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateDisplay() {
      timerElement.textContent = formatTime(timeLeft);
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (isRunning && timeLeft > 0) {
          timeLeft--;
          updateDisplay();
        } else if (timeLeft === 0) {
          nextImage();
        }
      }, 1000);
    }

    function nextImage() {
      currentImageIndex = (currentImageIndex + 1) % images.length;
      imgElement.src = images[currentImageIndex];
      timeLeft = TIME_PER_IMAGE;
      updateDisplay();
    }

    function prevImage() {
      currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
      imgElement.src = images[currentImageIndex];
      timeLeft = TIME_PER_IMAGE;
      updateDisplay();
    }

    btnToggle.addEventListener('click', () => {
      isRunning = !isRunning;
      btnToggle.textContent = isRunning ? '⏸ Pausar' : '▶ Continuar';
    });

    btnNext.addEventListener('click', nextImage);
    btnPrev.addEventListener('click', prevImage);

    // --- LÓGICA DO PLAYER DE MÚSICA (NATIVO DO SISTEMA) ---
    // Cria um elemento silencioso de áudio para habilitar o controle de mídia do sistema no navegador
    const silentAudio = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA');
    silentAudio.loop = true;

    document.getElementById('music-play').addEventListener('click', () => {
      if (silentAudio.paused) {
        silentAudio.play().catch(() => {});
      } else {
        silentAudio.pause();
      }
    });

    // Registra gatilhos da Media Session API para enviar os eventos ao sistema
    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', () => silentAudio.play());
      navigator.mediaSession.setActionHandler('pause', () => silentAudio.pause());
      navigator.mediaSession.setActionHandler('previoustrack', () => console.log('Comando: Faixa anterior'));
      navigator.mediaSession.setActionHandler('nexttrack', () => console.log('Comando: Próxima faixa'));
    }

    document.getElementById('music-prev').addEventListener('click', () => {
      if ('mediaSession' in navigator) {
        // Envia o comando de mídia para o sistema operacional
        window.dispatchEvent(new KeyboardEvent('keydown', { key: 'MediaTrackPrevious' }));
      }
    });

    document.getElementById('music-next').addEventListener('click', () => {
      if ('mediaSession' in navigator) {
        window.dispatchEvent(new KeyboardEvent('keydown', { key: 'MediaTrackNext' }));
      }
    });

    // Iniciar temporizador na carga da página
    updateDisplay();
    startTimer();
  </script>
</body>
</html>
