<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RefHub - Gerenciador de Referências</title>
  
  <!-- FontAwesome & Tailwind CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    .folder-active {
      background-color: #3b82f6;
      color: white;
    }
    .folder-active:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body class="bg-gray-100 font-sans h-screen flex flex-col md:flex-row overflow-hidden">

  <!-- Sidebar (Menu Lateral) -->
  <aside class="w-full md:w-64 bg-slate-900 text-white flex flex-col justify-between shrink-0 h-auto md:h-full">
    <div class="p-4">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
          <i class="fa-solid fa-bookmark text-blue-500"></i> RefHub
        </h1>
        <button id="btnNewFolder" class="bg-blue-600 hover:bg-blue-700 text-white text-xs py-1 px-2 rounded flex items-center gap-1">
          <i class="fa-solid fa-folder-plus"></i> Nova
        </button>
      </div>

      <!-- Lista de Pastas -->
      <nav class="space-y-1 overflow-y-auto max-h-[40vh] md:max-h-[calc(100vh-160px)]" id="foldersList">
        <button onclick="selectFolder('all')" id="folder-all" class="folder-active w-full text-left px-3 py-2 rounded flex items-center justify-between text-sm transition-colors">
          <span class="flex items-center gap-2"><i class="fa-solid fa-layer-group"></i> Todas as Referências</span>
          <span id="count-all" class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full">0</span>
        </button>
      </nav>
    </div>

    <!-- Status de Sincronização -->
    <div class="p-4 border-t border-slate-800 text-xs text-slate-400 flex items-center justify-between">
      <span class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
        Firebase On
      </span>
      <span class="text-[10px] text-slate-500">v2.0</span>
    </div>
  </aside>

  <!-- Conteúdo Principal -->
  <main class="flex-1 flex flex-col h-full overflow-hidden">
    
    <!-- Header/Busca -->
    <header class="bg-white border-b border-gray-200 p-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="relative w-full sm:w-80">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        <input type="text" id="searchInput" placeholder="Pesquisar referências..." class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <button id="btnNewRef" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg text-sm flex items-center justify-center gap-2 transition-colors">
        <i class="fa-solid fa-plus"></i> Nova Referência
      </button>
    </header>

    <!-- Área de Conteúdo (Cards/Tabela) -->
    <section class="flex-1 overflow-y-auto p-4 md:p-6" id="mainContent">
      <div id="referencesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Renderizado dinamicamente pelo JS -->
      </div>
      
      <!-- State vazio -->
      <div id="emptyState" class="hidden text-center py-16">
        <i class="fa-regular fa-folder-open text-5xl text-gray-300 mb-3"></i>
        <p class="text-gray-500 font-medium">Nenhuma referência encontrada aqui.</p>
        <p class="text-xs text-gray-400 mt-1">Clique em "Nova Referência" para adicionar uma.</p>
      </div>
    </section>

  </main>

  <!-- MODAL: Nova Pasta -->
  <div id="modalFolder" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg max-w-sm w-full p-6 shadow-xl">
      <h3 class="text-lg font-bold text-gray-800 mb-4">Criar Nova Pasta</h3>
      <input type="text" id="folderNameInput" placeholder="Nome da pasta..." class="w-full border border-gray-300 rounded-lg p-2 text-sm mb-4 focus:ring-2 focus:ring-blue-500 focus:outline-none">
      <div class="flex justify-end gap-2">
        <button id="btnCloseFolderModal" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg">Cancelar</button>
        <button id="btnSaveFolder" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">Salvar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: Nova Referência -->
  <div id="modalRef" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg max-w-md w-full p-6 shadow-xl">
      <h3 class="text-lg font-bold text-gray-800 mb-4">Adicionar Referência</h3>
      
      <form id="refForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Título</label>
          <input type="text" id="refTitle" required placeholder="Ex: Artigo sobre UI/UX" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Link (URL)</label>
          <input type="url" id="refUrl" required placeholder="https://..." class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Pasta</label>
          <select id="refFolderSelect" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <!-- Opções populadas dinamicamente -->
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Anotações / Descrição</label>
          <textarea id="refNotes" rows="3" placeholder="Resumo, observações..." class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="btnCloseRefModal" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg">Cancelar</button>
          <button type="submit" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">Salvar Referência</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase Scripts (v9+ Compatibility) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    // Suas configurações reais do Firebase já inseridas aqui:
    const firebaseConfig = {
      apiKey: "AIzaSyB0TXsAPXMmt_5QI8UPY028zjXy9dYQxAQ",
      authDomain: "refhub-studio.firebaseapp.com",
      projectId: "refhub-studio",
      storageBucket: "refhub-studio.firebasestorage.app",
      messagingSenderId: "334625263765",
      appId: "1:334625263765:web:ec9ee61d266db34eb10b9c"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Estado da Aplicação
    let folders = [];
    let references = [];
    let currentFolderId = 'all';

    // Elementos do DOM
    const foldersList = document.getElementById('foldersList');
    const referencesGrid = document.getElementById('referencesGrid');
    const emptyState = document.getElementById('emptyState');
    const refFolderSelect = document.getElementById('refFolderSelect');
    const searchInput = document.getElementById('searchInput');

    // Modais
    const modalFolder = document.getElementById('modalFolder');
    const modalRef = document.getElementById('modalRef');

    // Botões dos Modais
    document.getElementById('btnNewFolder').onclick = () => modalFolder.classList.replace('hidden', 'flex');
    document.getElementById('btnCloseFolderModal').onclick = () => modalFolder.classList.replace('flex', 'hidden');
    document.getElementById('btnNewRef').onclick = () => modalRef.classList.replace('hidden', 'flex');
    document.getElementById('btnCloseRefModal').onclick = () => modalRef.classList.replace('flex', 'hidden');

    // Escutar Mudanças nas Pastas no Firestore
    db.collection('folders').onSnapshot(snapshot => {
      folders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderFolders();
      updateSelectFolders();
    });

    // Escutar Mudanças nas Referências no Firestore
    db.collection('references').onSnapshot(snapshot => {
      references = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderReferences();
    });

    // Salvar Pasta
    document.getElementById('btnSaveFolder').onclick = async () => {
      const input = document.getElementById('folderNameInput');
      const name = input.value.trim();
      if (name) {
        await db.collection('folders').add({ name, createdAt: new Date() });
        input.value = '';
        modalFolder.classList.replace('flex', 'hidden');
      }
    };

    // Salvar Referência
    document.getElementById('refForm').onsubmit = async (e) => {
      e.preventDefault();
      const title = document.getElementById('refTitle').value;
      const url = document.getElementById('refUrl').value;
      const folderId = refFolderSelect.value;
      const notes = document.getElementById('refNotes').value;

      await db.collection('references').add({
        title,
        url,
        folderId,
        notes,
        createdAt: new Date()
      });

      e.target.reset();
      modalRef.classList.replace('flex', 'hidden');
    };

    // Deletar Referência
    async function deleteRef(id) {
      if (confirm('Deseja realmente excluir esta referência?')) {
        await db.collection('references').doc(id).delete();
      }
    }

    // Selecionar Pasta Ativa
    function selectFolder(id) {
      currentFolderId = id;
      document.querySelectorAll('#foldersList button').forEach(btn => {
        btn.classList.remove('folder-active');
        btn.classList.add('hover:bg-slate-800', 'text-slate-300');
      });
      
      const activeBtn = document.getElementById(`folder-${id}`);
      if (activeBtn) {
        activeBtn.classList.add('folder-active');
        activeBtn.classList.remove('hover:bg-slate-800', 'text-slate-300');
      }
      renderReferences();
    }

    // Renderizar Lista de Pastas
    function renderFolders() {
      // Manter a pasta "Todas"
      const allCount = references.length;
      foldersList.innerHTML = `
        <button onclick="selectFolder('all')" id="folder-all" class="${currentFolderId === 'all' ? 'folder-active' : 'hover:bg-slate-800 text-slate-300'} w-full text-left px-3 py-2 rounded flex items-center justify-between text-sm transition-colors">
          <span class="flex items-center gap-2"><i class="fa-solid fa-layer-group"></i> Todas as Referências</span>
          <span class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full">${allCount}</span>
        </button>
      `;

      folders.forEach(f => {
        const count = references.filter(r => r.folderId === f.id).length;
        const isActive = currentFolderId === f.id;
        foldersList.innerHTML += `
          <button onclick="selectFolder('${f.id}')" id="folder-${f.id}" class="${isActive ? 'folder-active' : 'hover:bg-slate-800 text-slate-300'} w-full text-left px-3 py-2 rounded flex items-center justify-between text-sm transition-colors">
            <span class="flex items-center gap-2 truncate"><i class="fa-regular fa-folder"></i> ${f.name}</span>
            <span class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full">${count}</span>
          </button>
        `;
      });
    }

    // Atualizar opções de pastas no formulário
    function updateSelectFolders() {
      refFolderSelect.innerHTML = `<option value="all">Geral (Sem pasta)</option>`;
      folders.forEach(f => {
        refFolderSelect.innerHTML += `<option value="${f.id}">${f.name}</option>`;
      });
    }

    // Renderizar Referências
    function renderReferences() {
      const query = searchInput.value.toLowerCase();
      
      let filtered = references.filter(r => {
        const matchesFolder = currentFolderId === 'all' || r.folderId === currentFolderId;
        const matchesSearch = r.title.toLowerCase().includes(query) || (r.notes && r.notes.toLowerCase().includes(query));
        return matchesFolder && matchesSearch;
      });

      if (filtered.length === 0) {
        referencesGrid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      referencesGrid.innerHTML = filtered.map(r => `
        <div class="bg-white p-4 rounded-xl border border-gray-200 hover:shadow-md transition-shadow flex flex-col justify-between">
          <div>
            <div class="flex items-start justify-between gap-2 mb-2">
              <h4 class="font-semibold text-gray-800 text-base leading-snug line-clamp-2">${r.title}</h4>
              <button onclick="deleteRef('${r.id}')" class="text-gray-400 hover:text-red-500 text-xs p-1">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
            ${r.notes ? `<p class="text-xs text-gray-500 mb-3 line-clamp-3">${r.notes}</p>` : ''}
          </div>
          
          <div class="pt-3 border-t border-gray-100 flex items-center justify-between text-xs mt-2">
            <a href="${r.url}" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:underline flex items-center gap-1 font-medium">
              Acessar Link <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
            </a>
          </div>
        </div>
      `).join('');
    }

    // Busca em Tempo Real
    searchInput.addEventListener('input', renderReferences);
  </script>
</body>
</html>
