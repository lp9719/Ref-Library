<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RefHub - Gerenciador de Referências</title>
  
  <!-- FontAwesome & Tailwind CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    .folder-active {
      background-color: #3b82f6;
      color: white;
    }
    .folder-active:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body class="bg-gray-100 font-sans h-screen flex flex-col md:flex-row overflow-hidden">

  <!-- Sidebar (Menu Lateral) -->
  <aside class="w-full md:w-72 bg-slate-900 text-white flex flex-col justify-between shrink-0 h-auto md:h-full">
    <div class="p-4 flex flex-col h-full overflow-hidden">
      <div class="flex items-center justify-between mb-6 shrink-0">
        <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
          <i class="fa-solid fa-bookmark text-blue-500"></i> RefHub
        </h1>
        <button id="btnNewFolder" class="bg-blue-600 hover:bg-blue-700 text-white text-xs py-1.5 px-3 rounded-lg flex items-center gap-1.5 font-medium transition-colors">
          <i class="fa-solid fa-folder-plus"></i> Nova Pasta
        </button>
      </div>

      <!-- Lista de Pastas e Subpastas -->
      <nav class="space-y-1 overflow-y-auto flex-1 pr-1" id="foldersList">
        <button onclick="selectFolder('all')" id="folder-all" class="folder-active w-full text-left px-3 py-2 rounded-lg flex items-center justify-between text-sm transition-colors">
          <span class="flex items-center gap-2"><i class="fa-solid fa-layer-group"></i> Todas as Referências</span>
          <span id="count-all" class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full">0</span>
        </button>
      </nav>
    </div>

    <!-- Status de Sincronização -->
    <div class="p-4 border-t border-slate-800 text-xs text-slate-400 flex items-center justify-between shrink-0">
      <span class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
        Firebase On
      </span>
      <span class="text-[10px] text-slate-500">v2.1</span>
    </div>
  </aside>

  <!-- Conteúdo Principal -->
  <main class="flex-1 flex flex-col h-full overflow-hidden">
    
    <!-- Header/Busca -->
    <header class="bg-white border-b border-gray-200 p-4 flex flex-col sm:flex-row items-center justify-between gap-4 shrink-0">
      <div class="relative w-full sm:w-80">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        <input type="text" id="searchInput" placeholder="Pesquisar referências..." class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <button id="btnNewRef" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg text-sm flex items-center justify-center gap-2 transition-colors">
        <i class="fa-solid fa-plus"></i> Nova Referência
      </button>
    </header>

    <!-- Área de Conteúdo (Cards com Imagem) -->
    <section class="flex-1 overflow-y-auto p-4 md:p-6" id="mainContent">
      <div id="referencesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <!-- Renderizado dinamicamente pelo JS -->
      </div>
      
      <!-- State vazio -->
      <div id="emptyState" class="hidden text-center py-16">
        <i class="fa-regular fa-folder-open text-5xl text-gray-300 mb-3"></i>
        <p class="text-gray-500 font-medium">Nenhuma referência encontrada aqui.</p>
        <p class="text-xs text-gray-400 mt-1">Clique em "Nova Referência" para adicionar uma.</p>
      </div>
    </section>

  </main>

  <!-- MODAL: Nova Pasta/Subpasta -->
  <div id="modalFolder" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-sm w-full p-6 shadow-xl">
      <h3 class="text-lg font-bold text-gray-800 mb-4">Criar Pasta ou Subpasta</h3>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nome da Pasta</label>
          <input type="text" id="folderNameInput" placeholder="Ex: Design System, Artigos..." class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Pasta Pai (opcional para subpasta)</label>
          <select id="parentFolderSelect" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <option value="root">Nenhuma (Pasta Raiz)</option>
          </select>
        </div>
      </div>

      <div class="flex justify-end gap-2 mt-6">
        <button id="btnCloseFolderModal" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg">Cancelar</button>
        <button id="btnSaveFolder" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">Salvar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: Nova Referência -->
  <div id="modalRef" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl">
      <h3 class="text-lg font-bold text-gray-800 mb-4">Adicionar Referência</h3>
      
      <form id="refForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Título</label>
          <input type="text" id="refTitle" required placeholder="Ex: Guia de Flexbox" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Link (URL)</label>
          <input type="url" id="refUrl" required placeholder="https://..." class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Pasta de Destino</label>
          <select id="refFolderSelect" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <!-- Opções populadas dinamicamente -->
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Anotações / Descrição</label>
          <textarea id="refNotes" rows="3" placeholder="Resumo, observações..." class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="btnCloseRefModal" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg">Cancelar</button>
          <button type="submit" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">Salvar Referência</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    // Suas configurações reais do Firebase:
    const firebaseConfig = {
      apiKey: "AIzaSyB0TXsAPXMmt_5QI8UPY028zjXy9dYQxAQ",
      authDomain: "refhub-studio.firebaseapp.com",
      projectId: "refhub-studio",
      storageBucket: "refhub-studio.firebasestorage.app",
      messagingSenderId: "334625263765",
      appId: "1:334625263765:web:ec9ee61d266db34eb10b9c"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let folders = [];
    let references = [];
    let currentFolderId = 'all';

    const foldersList = document.getElementById('foldersList');
    const referencesGrid = document.getElementById('referencesGrid');
    const emptyState = document.getElementById('emptyState');
    const refFolderSelect = document.getElementById('refFolderSelect');
    const parentFolderSelect = document.getElementById('parentFolderSelect');
    const searchInput = document.getElementById('searchInput');

    const modalFolder = document.getElementById('modalFolder');
    const modalRef = document.getElementById('modalRef');

    document.getElementById('btnNewFolder').onclick = () => modalFolder.classList.replace('hidden', 'flex');
    document.getElementById('btnCloseFolderModal').onclick = () => modalFolder.classList.replace('flex', 'hidden');
    document.getElementById('btnNewRef').onclick = () => modalRef.classList.replace('hidden', 'flex');
    document.getElementById('btnCloseRefModal').onclick = () => modalRef.classList.replace('flex', 'hidden');

    // Escutar Pastas
    db.collection('folders').onSnapshot(snapshot => {
      folders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderFolders();
      updateFolderSelects();
    });

    // Escutar Referências
    db.collection('references').onSnapshot(snapshot => {
      references = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderReferences();
      renderFolders();
    });

    // Salvar Pasta ou Subpasta
    document.getElementById('btnSaveFolder').onclick = async () => {
      const input = document.getElementById('folderNameInput');
      const parentId = parentFolderSelect.value;
      const name = input.value.trim();
      
      if (name) {
        await db.collection('folders').add({ 
          name, 
          parentId: parentId === 'root' ? null : parentId,
          createdAt: new Date() 
        });
        input.value = '';
        parentFolderSelect.value = 'root';
        modalFolder.classList.replace('flex', 'hidden');
      }
    };

    // Salvar Referência
    document.getElementById('refForm').onsubmit = async (e) => {
      e.preventDefault();
      const title = document.getElementById('refTitle').value;
      const url = document.getElementById('refUrl').value;
      const folderId = refFolderSelect.value;
      const notes = document.getElementById('refNotes').value;

      await db.collection('references').add({
        title,
        url,
        folderId,
        notes,
        createdAt: new Date()
      });

      e.target.reset();
      modalRef.classList.replace('flex', 'hidden');
    };

    // Deletar Referência
    async function deleteRef(id) {
      if (confirm('Deseja realmente excluir esta referência?')) {
        await db.collection('references').doc(id).delete();
      }
    }

    // Selecionar Pasta Ativa
    function selectFolder(id) {
      currentFolderId = id;
      renderFolders();
      renderReferences();
    }

    // Função para obter imagem de visualização / logo da URL
    function getPreviewImage(url) {
      try {
        const parsedUrl = new URL(url);
        // Gerador de captura/thumbnail gratuito utilizando microlink
        return `https://api.microlink.io/?url=${encodeURIComponent(url)}&embed=image.url`;
      } catch (e) {
        return null;
      }
    }

    // Obter todos os IDs de subpastas recursivamente
    function getFolderAndSubfolderIds(folderId) {
      let ids = [folderId];
      const children = folders.filter(f => f.parentId === folderId);
      children.forEach(child => {
        ids = ids.concat(getFolderAndSubfolderIds(child.id));
      });
      return ids;
    }

    // Renderizar Árvore de Pastas (Pastas e Subpastas)
    function renderFolders() {
      const allCount = references.length;
      let html = `
        <button onclick="selectFolder('all')" id="folder-all" class="${currentFolderId === 'all' ? 'folder-active' : 'hover:bg-slate-800 text-slate-300'} w-full text-left px-3 py-2 rounded-lg flex items-center justify-between text-sm transition-colors mb-1">
          <span class="flex items-center gap-2"><i class="fa-solid fa-layer-group"></i> Todas as Referências</span>
          <span class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full">${allCount}</span>
        </button>
      `;

      // Renderizar Pastas Raízes (sem parentId)
      const rootFolders = folders.filter(f => !f.parentId);

      function buildFolderTree(folderList, level = 0) {
        folderList.forEach(f => {
          const subfolderIds = getFolderAndSubfolderIds(f.id);
          const count = references.filter(r => subfolderIds.includes(r.folderId)).length;
          const isActive = currentFolderId === f.id;
          const paddingLeft = level * 16 + 12;

          html += `
            <button onclick="selectFolder('${f.id}')" id="folder-${f.id}" 
                    style="padding-left: ${paddingLeft}px"
                    class="${isActive ? 'folder-active' : 'hover:bg-slate-800 text-slate-300'} w-full text-left py-2 pr-3 rounded-lg flex items-center justify-between text-sm transition-colors mb-0.5">
              <span class="flex items-center gap-2 truncate">
                <i class="${level > 0 ? 'fa-solid fa-turn-up rotate-90 text-slate-500 text-xs' : 'fa-regular fa-folder'}"></i>
                <span class="truncate">${f.name}</span>
              </span>
              <span class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full ml-1">${count}</span>
            </button>
          `;

          const children = folders.filter(child => child.parentId === f.id);
          if (children.length > 0) {
            buildFolderTree(children, level + 1);
          }
        });
      }

      buildFolderTree(rootFolders);
      foldersList.innerHTML = html;
    }

    // Atualizar dropdowns de seleção de pastas
    function updateFolderSelects() {
      // Para selecionar Pasta Pai no modal de nova pasta
      parentFolderSelect.innerHTML = `<option value="root">Nenhuma (Pasta Raiz)</option>`;
      
      // Para selecionar Pasta de destino no modal de nova referência
      refFolderSelect.innerHTML = `<option value="all">Geral (Sem pasta)</option>`;

      folders.forEach(f => {
        const prefix = f.parentId ? '— ' : '';
        parentFolderSelect.innerHTML += `<option value="${f.id}">${prefix}${f.name}</option>`;
        refFolderSelect.innerHTML += `<option value="${f.id}">${prefix}${f.name}</option>`;
      });
    }

    // Renderizar Referências com Imagem
    function renderReferences() {
      const query = searchInput.value.toLowerCase();
      const validFolderIds = currentFolderId === 'all' ? null : getFolderAndSubfolderIds(currentFolderId);
      
      let filtered = references.filter(r => {
        const matchesFolder = currentFolderId === 'all' || (validFolderIds && validFolderIds.includes(r.folderId));
        const matchesSearch = r.title.toLowerCase().includes(query) || (r.notes && r.notes.toLowerCase().includes(query));
        return matchesFolder && matchesSearch;
      });

      if (filtered.length === 0) {
        referencesGrid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      referencesGrid.innerHTML = filtered.map(r => {
        const previewImg = getPreviewImage(r.url);
        let domain = '';
        try { domain = new URL(r.url).hostname.replace('www.', ''); } catch(e) {}

        return `
          <div class="bg-white rounded-xl border border-gray-200 overflow-hidden hover:shadow-lg transition-all flex flex-col justify-between group">
            <div>
              <!-- Imagem de Pré-visualização -->
              <div class="h-36 bg-gray-100 relative overflow-hidden border-b border-gray-100">
                <img src="${previewImg}" 
                     alt="${r.title}" 
                     class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                     onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'w-full h-full flex items-center justify-center bg-slate-50 text-slate-300\'><i class=\'fa-regular fa-image text-3xl\'></i></div>';">
                
                <button onclick="deleteRef('${r.id}')" class="absolute top-2 right-2 bg-white/90 hover:bg-red-500 hover:text-white text-gray-600 p-1.5 rounded-lg shadow-sm backdrop-blur-sm transition-colors text-xs">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>

              <div class="p-4">
                <div class="flex items-center gap-2 mb-1">
                  <img src="https://www.google.com/s2/favicons?domain=${domain}&sz=32" class="w-4 h-4 rounded" alt="" onerror="this.style.display='none'">
                  <span class="text-[11px] text-gray-400 font-medium truncate">${domain}</span>
                </div>
                
                <h4 class="font-semibold text-gray-800 text-base leading-snug line-clamp-2 mb-2 group-hover:text-blue-600 transition-colors">${r.title}</h4>
                ${r.notes ? `<p class="text-xs text-gray-500 line-clamp-2 mb-2">${r.notes}</p>` : ''}
              </div>
            </div>
            
            <div class="px-4 pb-4 pt-0">
              <a href="${r.url}" target="_blank" rel="noopener noreferrer" class="w-full bg-slate-50 hover:bg-blue-50 text-blue-600 font-medium text-xs py-2 px-3 rounded-lg flex items-center justify-center gap-1.5 transition-colors border border-gray-200/80">
                Acessar Link <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    searchInput.addEventListener('input', renderReferences);
  </script>
</body>
</html>
